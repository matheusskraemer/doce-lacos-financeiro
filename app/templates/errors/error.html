{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block body %}
<div class="login-form min-vh-100">
  <div class="text-center">
    <img class="brand-logo mb-3" src="{{ url_for('brand.logo') }}" alt="">
    <div class="text-muted small mb-1">Erro {{ code }}</div>
    <h1 class="display h3">{{ title }}</h1>
    <p class="text-muted">{{ message }}</p>
    <a class="btn btn-brand" href="{{ url_for('dashboard.index') }}">Ir para a visão geral</a>
  </div>
</div>
{% endblock %}
