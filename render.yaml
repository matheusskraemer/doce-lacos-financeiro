# Blueprint do Render (Infraestrutura como código).
# Planos: web 0.5c-512mb (~US$ 7/mês) e Postgres 0.1c-256mb (~US$ 6/mês).
services:
  - type: web
    name: doce-lacos-financeiro
    runtime: python
    plan: 0.5c-512mb
    region: virginia
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask --app wsgi db upgrade && flask --app wsgi setup
    startCommand: gunicorn wsgi:app --workers 2 --bind 0.0.0.0:$PORT --access-logfile -
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: doce-lacos-db
          property: connectionString

databases:
  - name: doce-lacos-db
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    region: virginia
    databaseName: docelacos
    user: docelacos
    ipAllowList: []   # sem acesso externo ao banco; só a aplicação no Render
